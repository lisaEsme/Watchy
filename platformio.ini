; PlatformIO project for our Watchy (ESP32-PICO-D4, hardware revision v2.0, USB-C).
;
; In VS Code with the PlatformIO extension: open this repository folder, then use
; the PlatformIO toolbar: Build (tick), Upload (arrow), Serial Monitor (plug).
; From a terminal:  pio run -t upload   and   pio device monitor
;
; Our watch face code lives in watchface/. The Watchy library code in src/ is
; compiled straight from this repository, so any changes we make there are used.

[platformio]
src_dir = watchface
default_envs = watchy-v20

[env]
; espressif32 6.9.0 ships Arduino-ESP32 core 2.0.17, the same core the upstream
; project builds with. Newer 3.x cores are not supported by this code.
platform = platformio/espressif32@6.9.0
framework = arduino

; ESP32-PICO-D4 board, using Arduino-ESP32's built-in "watchy" pin definitions
board = pico32
board_build.variant = watchy
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = dio
board_build.partitions = huge_app.csv
board_upload.maximum_size = 3145728


; Library versions pinned to the exact commits that built and ran on our watch.
; Order matters: each library's own dependencies are listed before it, so the
; pinned copies are used instead of PlatformIO fetching unpinned ones.
; Rtc_Pcf8563 must stay on this 2022 commit: newer ones fail to compile on core 2.0.17.
lib_deps =
    https://github.com/adafruit/Adafruit_BusIO.git#3b8364267c3ee6e16bad91bc2101aefbd5b5915f
    https://github.com/adafruit/Adafruit-GFX-Library.git#03013b4e64c8e212f27c2a158244139ba43d3425
    https://github.com/arduino-libraries/Arduino_JSON.git#e19aed2728fbfefa189e6861034e1933eee46120
    https://github.com/PaulStoffregen/Time.git#a18e50dcea4ee17285d732d39e7bc559482d1d3d
    https://github.com/JChristensen/DS3232RTC.git#f515a11a416db6d6709543db009090237c7dd807
    https://github.com/arduino-libraries/NTPClient.git#26dc2f2b24d057380d637244ef34b8ce92d1c374
    https://github.com/orbitalair/Rtc_Pcf8563.git#7e2ece1e5bc6ccd49af1a9c4ca98f70ce475704a
    https://github.com/ZinggJM/GxEPD2.git#de82887e77a78528ea386e68bba2cb0291d2c319
    https://github.com/tzapu/WiFiManager.git#4131fe617d01d746677e8b909379597162c2ca58
    ; The Watchy library itself, compiled from src/ in this repository so our local edits
    ; are used. pio-lib/library.json points at src/ without listing dependencies, so
    ; only the pinned versions above are ever downloaded.
    symlink://pio-lib
lib_ldf_mode = chain+

upload_speed = 921600
monitor_speed = 115200
; Keep the serial monitor from holding the watch in reset via the USB chip's DTR/RTS lines
monitor_rts = 0
monitor_dtr = 0

[env:watchy-v20]
build_flags = -D ARDUINO_WATCHY_V20
